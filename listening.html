<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const LETTERS = ['A','B','C','D','E'];
const qsEl = document.getElementById('qs');
let answered = 0, correctN = 0;

function renderTranscript(t, box, audioEl){
  // t: {segments:[...], turns:[{spk,start,end}], hl_turns:[idx], highlights:[str]}
  box.innerHTML = '';
  const norm = s => s.trim().toLowerCase().replace(/[.,!?;:"'’“”"']/g,'');
  const hl = new Set((t.highlights||[]).map(norm));
  const all = [];
  const mkWord = (w) => {
    const s = document.createElement('span');
    s.className = 'w';
    s.textContent = w.w;
    s.dataset.start = w.s; s.dataset.end = w.e;
    if (!t.hl_turns && hl.size && hl.has(norm(w.w))) s.classList.add('answ');
    const line = document.createElement('span');
    line.className = 'wline';
    line.appendChild(s);
    box.appendChild(line);
    return {el: s, start: parseFloat(w.s), end: parseFloat(w.e)};
  };
  (t.segments||[]).forEach(seg=>{
    (seg.words||[]).forEach(w=>all.push(mkWord(w)));
    if(!(seg.words||[]).length) all.push(mkWord({w:seg.text, s:seg.start, e:seg.end}));
  });
  if (t.turns) {  // 按说话人轮次重新分组, 加 M./W. 标签
    box.innerHTML = '';
    t.turns.forEach(tn=>{
      const line = document.createElement('div');
      line.className = 'wline turnline';
      const sp = document.createElement('span');
      sp.className = 'spk'; sp.textContent = tn.spk + '.';
      line.appendChild(sp);
      box.appendChild(line);
      tn._line = line;
    });
    let ti = 0;
    all.forEach(o=>{
      while (ti+1 < t.turns.length && o.start >= t.turns[ti+1].start) ti++;
      t.turns[ti]._line.appendChild(o.el);
    });
    // 整句高亮: hl_turns 里的轮次整行标蓝
    (t.hl_turns||[]).forEach(i=>{ if(t.turns[i]) t.turns[i]._line.classList.add('hl-line'); });
    // 点击句子重读
    if (audioEl) t.turns.forEach(tn=>{
      tn._line.title = '点击重读这句';
      tn._line.addEventListener('click', ()=>{
        audioEl.currentTime = tn.start;
        audioEl.play().catch(()=>{});
      });
    });
  }
  return all.map(o=>o.el);
}

function fmt(n){return String(n)}

DATA.questions.forEach((q,i)=>{
  const card = document.createElement('div');
  card.className='q';
  const num = document.createElement('div');
  num.className='num'; num.textContent = '第 '+q.id+' 题';
  const text = document.createElement('div');
  text.className='text'; text.textContent = q.text;
  card.append(num, text);
  const optBox = document.createElement('div');
  (q.options||[]).forEach((o,oi)=>{
    const b = document.createElement('button');
    b.className='opt';
    b.innerHTML = LETTERS[oi]+'．'+String(o).replace(/^([A-E])\.\s*/,'');
    b.onclick = ()=>answer(q,i,b,oi);
    optBox.appendChild(b);
  });
  card.appendChild(optBox);
  const fb = document.createElement('div'); fb.className='feedback';
  card.appendChild(fb);
  const transcriptWords = {};
  (q.clips||[]).forEach((clip,ci)=>{
    const label = document.createElement('div');
    label.className='cliplabel';
    label.textContent = q.clip_labels ? (q.clip_labels[ci]||('音频片段 '+(ci+1))) : ('音频片段 '+(ci+1));
    card.appendChild(label);
    const a = document.createElement('audio');
    a.controls = true; a.preload='auto'; a.src = clip;
    // 独占播放: 本段开始播放时, 暂停页面上所有其他音频
    a.addEventListener('play', ()=>{
      document.querySelectorAll('audio').forEach(o=>{ if(o!==a) o.pause(); });
    });
    card.appendChild(a);
    let box=null, words=[];
    if(q.transcripts && q.transcripts[ci]){
      const t = q.transcripts[ci];
      const tg = document.createElement('button');
      tg.className='transcript-toggle'; tg.textContent='▸ 显示听力原文';
      card.appendChild(tg);
      box = document.createElement('div'); box.className='transcript';
      card.appendChild(box);
      words = renderTranscript(t, box, a);
      tg.onclick = ()=>{
        const open = box.classList.toggle('open');
        tg.textContent = open ? '▾ 隐藏听力原文' : '▸ 显示听力原文';
      };
      a.addEventListener('timeupdate', ()=>{
        if(!words.length || !box.classList.contains('open')) return;
        const ct = a.currentTime;
        let lo=0, hi=words.length-1, best=-1;
        while(lo<=hi){const m=(lo+hi)>>1;
          if(parseFloat(words[m].dataset.start)<=ct) best=m, lo=m+1; else hi=m-1;}
        words.forEach(w=>w.classList.remove('cur'));
        if(best>=0 && ct<=parseFloat(words[best].dataset.end)+0.15)
          words[best].classList.add('cur'), words[best].scrollIntoView({block:'nearest'});
      });
    }
  });
  qsEl.appendChild(card);
  q._fb = fb; q._opts = optBox;
});

function answer(q,i,btn,oi){
  if(q._done) return;
  q._done = true;
  const ans = q.answer, chosen = LETTERS[oi];
  const isOk = String(chosen)===String(ans);
  q._opts.querySelectorAll('.opt').forEach(o=>o.disabled=true);
  const okBtn = q._opts.querySelectorAll('.opt')[LETTERS.indexOf(String(ans))];
  btn.classList.add(isOk?'correct':'wrong');
  if(!isOk && okBtn && okBtn!==btn) okBtn.classList.add('correct');
  answered++; if(isOk) correctN++;
  document.getElementById('score').textContent = '已答 '+answered+' 题 · 正确 '+correctN;
  const fb = q._fb;
  if(isOk){ fb.textContent='✓ 回答正确'; fb.className='feedback ok'; }
  else{
    const ai = LETTERS.indexOf(String(ans));
    fb.innerHTML='✗ 回答错误，正确答案：<span class="ans">'+ans+'．'+(q.options[ai]||'')+'</span>';
    fb.className='feedback bad';
    // reveal answer-highlighted transcript words on all open transcripts of this question
    if(!q._revealed){ q._revealed=true;
      // ensure any hidden transcript of this question becomes visible so highlight is usable
    }
  }
}
</script>
